name: Sync Fork with Upstream

on:
  schedule:
    - cron: '0 2 * * *'  # 每天 UTC 2:00 执行（北京时间 10:00）
  workflow_dispatch:     # 允许手动触发

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: master

      - name: Add upstream repo
        run: |
          git remote add upstream https://github.com/qist/tvbox.git
          git fetch upstream

      - name: Merge upstream changes
        run: |
          git checkout master
          git merge upstream/master --no-edit --no-ff || true

      - name: Push changes
        uses: ad-m/github-push-action@v4
        with:
          branch: master
          github_token: ${{ secrets.GITHUB_TOKEN }}
          force: false
